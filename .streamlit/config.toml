# Two themes. Viewers switch between them in Streamlit's own menu.
# primaryColor drives main buttons and selected states (toggles, sliders,
# checkboxes, the Calendar/Map switch).

[theme.light]
primaryColor = "#E01719"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F6F6"
textColor = "#46494D"

[theme.dark]
primaryColor = "#E01719"
backgroundColor = "#003557"
secondaryBackgroundColor = "#46494D"
textColor = "#FFFFFF"
