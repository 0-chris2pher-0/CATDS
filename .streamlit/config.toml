# Two themes. Viewers switch between them in Streamlit's own menu.

# primaryColor is a neutral gray so the claims table stays white with a light gray

# highlight for selected/hovered cells (Streamlit tints the table with this color).

# It also colors checkboxes, toggles, sliders and filter tags. Main action buttons

# and the Calendar/Map switch are red, set in the app's CSS.

 

[theme.light]

primaryColor = "#6B6D71"

backgroundColor = "#FFFFFF"

secondaryBackgroundColor = "#F6F6F6"

textColor = "#46494D"

 

[theme.dark]

primaryColor = "#B5B6B8"

backgroundColor = "#003557"

secondaryBackgroundColor = "#46494D"

textColor = "#FFFFFF"
